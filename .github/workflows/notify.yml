name: Notify Pipeline Repo on Rego Change

on:
  push:
    branches:
      - dev
      - test
      - prod
    paths:
      - "**.rego" # only fires when .rego files are touched

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Map branch to environment label
        id: vars
        run: |
          case "${{ github.ref_name }}" in
            dev)     ENV="dev" ;;
            test) ENV="test" ;;
            prod)    ENV="prod" ;;
            *)       echo "Unknown branch" && exit 1 ;;
          esac
          echo "env=$ENV"               >> $GITHUB_OUTPUT
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Dispatch to pipeline repo
        uses: peter-evans/repository-dispatch@v3
        with:
          # PAT stored in Repo 1's secrets — needs repo scope on Repo 2
          token: ${{ secrets.PIPELINE_REPO_PAT }}
          repository: NivedGanga/WASML # ← change this
          event-type: rego-changed
          client-payload: |
            {
              "branch": "${{ steps.vars.outputs.branch }}",
              "env":    "${{ steps.vars.outputs.env }}",
              "sha":    "${{ github.sha }}"
            }
