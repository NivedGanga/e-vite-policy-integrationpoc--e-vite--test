name: Build and Store Wasm

on:
  push:
    branches:
      - "**" # Triggers on any branch
    paths-ignore:
      - "executable/**" # Prevent infinite loop if we push a change strictly to the executable folder

permissions:
  contents: write # Needed to push the wasm file back to the repository

jobs:
  build-and-store:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # Checkout the branch that was pushed
          fetch-depth: 0
          persist-credentials: true

      - name: Install OPA
        run: |
          set -euo pipefail
          # Pin OPA to the local version (keep this in sync with your machine)
          OPA_VERSION=1.15.1
          ARCH=$(uname -m)
          case "${ARCH}" in
            x86_64) ARCH_NAME=amd64 ;;
            aarch64|arm64) ARCH_NAME=arm64 ;;
            *) ARCH_NAME=amd64 ;;
          esac
          OPA_FILE=opa_linux_${ARCH_NAME}_static
          URL="https://openpolicyagent.org/downloads/v${OPA_VERSION}/${OPA_FILE}"
          echo "Downloading OPA from ${URL}"
          curl -L -o opa "${URL}"
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Build and Commit Wasm
        run: |
          set -euo pipefail
          mkdir -p out
          mkdir -p executable

          opa build \
            --target wasm \
            --entrypoint evite/result \
            ./craft-policies \
            -o bundle.tar.gz

          tar -xzf bundle.tar.gz -C out
          cp out/policy.wasm executable/policy.wasm

          echo "Built and stored executable/policy.wasm"

          if [[ -z "$(git status --porcelain -- executable/policy.wasm)" ]]; then
            echo "No changes in executable/policy.wasm; skipping commit and push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add executable/policy.wasm
          git commit -m "chore: update built policy.wasm"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
