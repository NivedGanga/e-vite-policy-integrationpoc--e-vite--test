name: Build and Store Wasm

on:
  push:
    branches:
      - "**" # Triggers on any branch
    paths-ignore:
      - "executable/**" # Prevent infinite loop if we push a change strictly to the executable folder

permissions:
  contents: write # Needed to push the wasm file back to the repository

jobs:
  build-and-store:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # Checkout the branch that was pushed
          fetch-depth: 0
          persist-credentials: true

      - name: Install OPA
        run: |
          set -euo pipefail
          # Pin OPA to the local version (keep this in sync with your machine)
          OPA_VERSION=1.15.1
          ARCH=$(uname -m)
          case "${ARCH}" in
            x86_64) ARCH_NAME=amd64 ;;
            aarch64|arm64) ARCH_NAME=arm64 ;;
            *) ARCH_NAME=amd64 ;;
          esac
          OPA_FILE=opa_linux_${ARCH_NAME}_static
          URL="https://openpolicyagent.org/downloads/v${OPA_VERSION}/${OPA_FILE}"
          echo "Downloading OPA from ${URL}"
          curl -L -o opa "${URL}"
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Build Wasm
        run: |
          set -euo pipefail
          mkdir -p out
          mkdir -p executable

          opa build \
            --target wasm \
            --entrypoint evite/result \
            ./craft-policies \
            -o bundle.tar.gz

          tar -xzf bundle.tar.gz -C out
          # Inspect bundle and copy Wasm
          echo "--- bundle contents ---"
          tar -tzf bundle.tar.gz | sed -n '1,200p'
          tar -xzf bundle.tar.gz -C out
          ls -l out || true
          if [ -f out/policy.wasm ]; then
            echo "sha256 out/policy.wasm:"; sha256sum out/policy.wasm || true
            cp -v out/policy.wasm executable/policy.wasm
            echo "sha256 executable/policy.wasm after copy:"; sha256sum executable/policy.wasm || true
          else
            echo "ERROR: out/policy.wasm not found"
            exit 1
          fi
          echo "Built and stored executable/policy.wasm"

      - name: Commit and Push Wasm file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "--- pre-commit status ---"
          git status --porcelain || true
          echo "--- staged differences (if any) ---"
          git add executable/policy.wasm || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: update built policy.wasm"
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            echo "Pushing to ${BRANCH_NAME}"
            git push "https://${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH_NAME}"
          fi
